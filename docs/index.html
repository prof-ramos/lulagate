Todas as informações deste mapa vêm de reportagens já publicadas por veículos de imprensa estabelecidos ou de documentos oficiais (STF, STJ, TRF4, PF, CGU, TCU, Câmara, Senado, Presidência, TSE). Nomes, datas, valores, conexões e situações jurídicas são os que essas fontes noticiaram até a data de corte. O mapa não traz apuração própria nem informação inédita.

## Avisos importantes

- **Uma conexão neste mapa não indica culpa.** Vínculos familiares, funcionais, políticos, sociais ou de negócios são registrados porque foram documentados, não porque provem crime.
- Cada caso e cada conexão traz um campo \`status\`: \`condenacao_anulada\`, \`arquivado\` (inclui ações trancadas e prescritas), \`absolvido\`, \`investigacao_em_curso\`, \`fato_documentado\`, \`associacao_indireta\` e \`alegacao_nao_comprovada\`.
- Lula nega as acusações. Sua versão está no campo \`versao_de_lula\` de cada caso; quando não foi localizada manifestação dele nas fontes, isso é dito explicitamente.
- **Até a data de corte, Lula não tem condenação vigente.** As condenações do triplex do Guarujá (2017/2018) e do sítio de Atibaia (2019) foram anuladas pelo STF em 2021: em 08/03/2021 o ministro Edson Fachin declarou a incompetência da 13ª Vara Federal de Curitiba (HC 193.726), e em 23/06/2021 o Plenário confirmou a suspeição de Sergio Moro (HC 164.493). Os casos foram depois encerrados por prescrição na Justiça Federal do DF. As ações do Instituto Lula e do caso Gripen foram trancadas pelo STF em 2023. Lula foi absolvido nos casos quadrilhão do PT (2019), obstrução de Justiça (2018) e Zelotes/MP 471 (2021).
- Anulação, arquivamento e trancamento não equivalem a absolvição de mérito; o mapa registra exatamente o desfecho processual noticiado.
- Relatórios de CPI/CPMI não indiciam nem condenam: registram sugestões às autoridades. Alegações de testemunhas citadas nesses relatórios aparecem como \`alegacao_nao_comprovada\`.
- Investigações sobre parentes (Lulinha, Frei Chico) não envolvem Lula como investigado.

## Critérios

- Cada caso e cada conexão tem pelo menos uma fonte com URL, veículo e data.
- Proximidade (\`proximidade_lula\`, de 0 a 1) em sete faixas: 0,90 a 1,00 família imediata ou convívio íntimo; 0,70 a 0,89 círculo próximo; 0,50 a 0,69 vínculo direto, forte e repetido; 0,30 a 0,49 vínculo direto pontual ou apenas alegado; 0,10 a 0,29 vínculo fraco ou indireto; 0,01 a 0,09 apenas contexto; 0 nenhum vínculo. Os valores são atribuição editorial a partir dos vínculos documentados, não cálculo automático nem medida de culpa.
- \`nivel_juridico\` (0 a 4) é escala separada sobre a situação jurídica da própria pessoa.
- Valores são nominais, na moeda noticiada.
- Alegações sem fonte verificável ficaram de fora.

odo:{inicio:`2023`,fim:`2024`},descricao:`Antes de assumir o Ministério da Justiça, segundo O Globo.`,escandalos:[`esc-banco-master`],fontes:[`oglobo-2026-04-10-master-servicos`],data_referencia:`2026-04-10`}],escandalos:[{id:`esc-mensalao`,titulo:`Mensalão (AP 470)`,periodo:{inicio:`2005`,fim:`2012-12`},status:`associacao_indireta`,status_detalhe:`Lula nunca foi denunciado. O STF rejeitou pedidos de Roberto Jefferson para incluí-lo como réu. José Dirceu foi condenado em 2012 por corrupção ativa.`,resumo:`Esquema de compra de apoio parlamentar no primeiro governo Lula, julgado pelo STF na AP 470. O ex-ministro da Casa Civil José Dirceu foi condenado. Lula não figurou como réu.`,papel_de_lula:`Presidente da República à época; não denunciado.`,versao_de_lula:`No Roda Viva (07/11/2005), disse sentir-se traído por petistas que "terceirizaram" a arrecadação de campanha e admitiu responsabilidade política na crise (Folha, 08/11/2005).`,personagens:[`lula`,`jose-dirceu`,`delubio-soares`,`roberto-jefferson`],valores:[],escandalos_relacionados:[],fontes:[`g1-2012-10-dirceu`,`gazeta-stf-lula-mensalao`,`planalto-2005-11-07-rodaviva`,`folha-2005-11-08-responsabilidade`,`folha-2005-11-09-delubio`],conexoes:[`con-006`,`con-007`,`con-008`]},{id:`esc-triplex`,titulo:`Lava Jato: triplex do Guarujá`,periodo:{inicio:`2016`,fim:`2022-01-27`},status:`condenacao_anulada`,status_detalhe:`Condenação anulada pelo STF: em 08/03/2021 Fachin declarou a incompetência da 13ª Vara de Curitiba (HC 193.726); em 23/06/2021 o Plenário confirmou a suspeição de Sergio Moro (HC 164.493). Em 27/01/2022 a 12ª Vara Federal do DF arquivou a ação por prescrição, a pedido do MPF.`,resumo:`Lula foi condenado por Sergio Moro em 12/07/2017 a 9 anos e 6 meses por corrupção passiva e lavagem, sob acusação de receber da OAS o apartamento 164-A do Solaris e reformas. O TRF4 elevou a pena para 12 anos e 1 mês em 24/01/2018. Preso em 07/04/2018, foi solto em 08/11/2019 após 580 dias. A condenação foi anulada em 2021 e o caso, arquivado em 2022. Na mesma sentença, Lula e Okamotto foram absolvidos da acusação ligada ao armazenamento do acervo presidencial.`,papel_de_lula:`Réu; condenado em 1ª e 2ª instâncias, condenação anulada.`,versao_de_lula:`Em depoimento a Moro (10/05/2017), negou ser dono do triplex e disse nunca ter tido intenção de comprá-lo. Lula sempre negou as acusações. Após a anulação, disse ter sido "vítima da maior mentira jurídica contada em 500 anos de história" (CNN Brasil, 10/03/2021).`,personagens:[`lula`,`marisa-leticia`,`leo-pinheiro`,`paulo-okamotto`,`sergio-moro`,`edson-fachin`,`gilmar-mendes`,`pollyanna-alves`,`cristiano-zanin`],valores:[{descricao:`Pena na sentença de Moro`,valor:`9 anos e 6 meses`},{descricao:`Pena no TRF4`,valor:`12 anos e 1 mês`}],escandalos_relacionados:[`esc-atibaia`],fontes:[`g1-2017-07-sentenca-triplex`,`trf4-2018-01-24-triplex`,`agbr-2018-01-trf4`,`g1-2017-05-depoimento-lula`,`g1-2017-leo-pinheiro`,`stf-2021-03-08-fachin`,`stf-2021-06-23-suspeicao`,`conjur-2022-01-28-triplex`,`folha-2019-11-08-solto`,`cnn-2021-03-10-mentira`,`agbr-2017-07-okamotto`],conexoes:[`con-001`,`con-019`,`con-022`,`con-036`,`con-037`,`con-039`,`con-040`,`con-045`]},{id:`esc-atibaia`,titulo:`Lava Jato: sítio de Atibaia`,periodo:{inicio:`2017`,fim:`2021-08-21`},status:`condenacao_anulada`,status_detalhe:`Condenação anulada pelo STF: em 08/03/2021 Fachin declarou a incompetência da 13ª Vara de Curitiba (HC 193.726); em 23/06/2021 o Plenário confirmou a suspeição de Sergio Moro (HC 164.493). Em 21/08/2021 a Justiça Federal do DF rejeitou a nova denúncia e declarou extinta a punibilidade por prescrição.`,resumo:`Gabriela Hardt condenou Lula em 06/02/2019 a 12 anos e 11 meses por corrupção e lavagem, por reformas no sítio (proprietário formal: Fernando Bittar) custeadas por Odebrecht, OAS e Bumlai, segundo a acusação. O TRF4 elevou a pena para 17 anos, 1 mês e 10 dias em 27/11/2019 e absolveu Bumlai, Roberto Teixeira, Emyr Costa e Paulo Gordilho. A condenação de Lula foi anulada em 2021.`,papel_de_lula:`Réu; condenado em 1ª e 2ª instâncias, condenação anulada.`,versao_de_lula:`A defesa (Cristiano Zanin) alegou no TRF4 parcialidade de Moro e Hardt e ausência de prova de vantagem indevida. Lula sempre negou as acusações. Após a anulação, disse ter sido "vítima da maior mentira jurídica contada em 500 anos de história" (CNN Brasil, 10/03/2021).`,personagens:[`lula`,`marisa-leticia`,`fernando-bittar`,`jose-carlos-bumlai`,`leo-pinheiro`,`emilio-odebrecht`,`marcelo-odebrecht`,`alexandrino-alencar`,`emyr-costa`,`paulo-gordilho`,`roberto-teixeira`,`rogerio-pimentel`,`gabriela-hardt`,`pollyanna-alves`,`cristiano-zanin`],valores:[{descricao:`Pena na sentença de Hardt`,valor:`12 anos e 11 meses`},{descricao:`Pena no TRF4`,valor:`17 anos, 1 mês e 10 dias`}],escandalos_relacionados:[`esc-triplex`],fontes:[`uol-2019-02-06-atibaia`,`trf4-2019-11-27-atibaia`,`stf-2021-03-08-fachin`,`folha-2021-08-22-atibaia`,`g1-2021-08-22-atibaia`,`cnn-2021-03-10-mentira`],conexoes:[`con-001`,`con-021`,`con-022`,`con-023`,`con-024`,`con-025`,`con-026`,`con-027`,`con-028`,`con-029`,`con-034`,`con-035`,`con-036`,`con-038`,`con-039`,`con-045`]},{id:`esc-instituto-lula`,titulo:`Lava Jato: terreno e doações ao Instituto Lula (Odebrecht) e delação de Palocci`,periodo:{inicio:`2017`,fim:`2023-02`},status:`arquivado`,status_detalhe:`Ações declaradas fora da competência de Curitiba em 08/03/2021 e trancadas pelo STF (Lewandowski) em fevereiro de 2023, por provas consideradas nulas. A delação de Palocci foi excluída do processo pela 2ª Turma do STF em 2020. Em 06/09/2023 Toffoli invalidou provas do acordo de leniência da Odebrecht. Não houve sentença de mérito.`,resumo:`O MPF acusou Lula de receber da Odebrecht um imóvel para o Instituto Lula (avaliado em R$ 12,4 milhões, segundo a decisão do HC 193.726) e um apartamento em São Bernardo do Campo, além de doações ao instituto. Palocci afirmou a Moro, em 2017, que Lula tinha um "pacto de sangue" com Emílio Odebrecht.`,papel_de_lula:`Réu; ações trancadas.`,versao_de_lula:`Lula sempre negou as acusações. Após a anulação, disse ter sido "vítima da maior mentira jurídica contada em 500 anos de história" (CNN Brasil, 10/03/2021).`,personagens:[`lula`,`paulo-okamotto`,`antonio-palocci`,`emilio-odebrecht`,`edson-fachin`,`ricardo-lewandowski`,`dias-toffoli`],valores:[{descricao:`Valor atribuído ao imóvel para o Instituto Lula`,valor:12422e3,moeda:`BRL`},{descricao:`Apartamento em São Bernardo do Campo`,valor:504e3,moeda:`BRL`}],escandalos_relacionados:[`esc-atibaia`],fontes:[`stf-hc193726-decisao`,`stf-2023-02-tres-acoes`,`conjur-2023-02-18-tranca`,`bbc-2017-09-palocci`,`conjur-2020-12-14-palocci`,`valor-2020-08-04-palocci`,`g1-2023-09-06-toffoli`,`cnn-2021-03-10-mentira`],conexoes:[`con-009`,`con-010`,`con-019`,`con-023`,`con-039`,`con-041`,`con-042`]},{id:`esc-bumlai-schahin`,titulo:`Bumlai e o empréstimo do Banco Schahin`,periodo:{inicio:`2004`,fim:`2021-10-22`},status:`condenacao_anulada`,status_detalhe:`Condenação de Bumlai e Vaccari anulada pelo STJ em 2021 por incompetência; caso remetido à Justiça Eleitoral. Lula não era réu.`,resumo:`Moro condenou o pecuarista José Carlos Bumlai em 15/09/2016 por obter, em 2004, empréstimo de R$ 12 milhões no Banco Schahin destinado ao PT, quitado de forma fraudulenta segundo a sentença.`,papel_de_lula:`Não réu; amigo de Bumlai.`,versao_de_lula:`Sem manifestação de Lula localizada nas fontes consultadas.`,personagens:[`jose-carlos-bumlai`,`joao-vaccari`,`lula`],valores:[{descricao:`Empréstimo do Banco Schahin`,valor:12e6,moeda:`BRL`}],escandalos_relacionados:[],fontes:[`oglobo-2016-bumlai`,`g1-2016-09-bumlai`,`stj-2021-10-22-schahin`,`oglobo-2021-stj-schahin`],conexoes:[`con-014`,`con-021`]},{id:`esc-quadrilhao`,titulo:`Quadrilhão do PT`,periodo:{inicio:`2017`,fim:`2019-12-04`},status:`absolvido`,status_detalhe:`Absolvição sumária pela 12ª Vara Federal do DF em 04/12/2019.`,resumo:`Lula, Dilma, Palocci, Mantega e Vaccari foram acusados de organização criminosa. O juiz concluiu que a denúncia não demonstrava organização estável e tentava criminalizar a atividade política.`,papel_de_lula:`Réu; absolvido.`,versao_de_lula:`Lula negou as acusações; foi absolvido sumariamente.`,personagens:[`lula`,`dilma-rousseff`,`antonio-palocci`,`guido-mantega`,`joao-vaccari`,`marcus-bastos`],valores:[],escandalos_relacionados:[],fontes:[`g1-2019-12-04-quadrilhao`,`conjur-2019-12-sentenca-quadrilhao`],conexoes:[`con-011`,`con-012`,`con-013`,`con-047`]},{id:`esc-obstrucao-cervero`,titulo:`Obstrução de Justiça (caso Delcídio/Cerveró)`,periodo:{inicio:`2016`,fim:`2018-07-12`},status:`absolvido`,status_detalhe:`Absolvição pela 10ª Vara Federal do DF em 12/07/2018 por falta de provas.`,resumo:`A denúncia dizia que Delcídio do Amaral tentou comprar o silêncio de Nestor Cerveró para evitar sua delação. Lula, Delcídio, André Esteves e outros foram absolvidos.`,papel_de_lula:`Réu; absolvido.`,versao_de_lula:`Lula negou as acusações; foi absolvido.`,personagens:[`lula`,`delcidio-amaral`,`nestor-cervero`,`andre-esteves`,`ricardo-leite`],valores:[],escandalos_relacionados:[],fontes:[`g1-2018-07-12-obstrucao`,`agbr-2018-07-obstrucao`],conexoes:[`con-048`,`con-049`,`con-050`,`con-051`]},{id:`esc-angola-bndes`,titulo:`Operação Janus: Odebrecht em Angola e BNDES`,periodo:{inicio:`2016-10`,fim:`2020-09-01`},status:`arquivado`,status_detalhe:`Em julho de 2019 a Justiça Federal do DF absolveu Lula de parte das acusações; em 01/09/2020 o TRF1 trancou a ação remanescente.`,resumo:`O MPF acusou Lula de tráfico de influência para favorecer a Odebrecht em financiamentos do BNDES para obras em Angola, com Taiguara Rodrigues dos Santos e a Exergia. A ação foi trancada.`,papel_de_lula:`Réu; parcialmente absolvido e ação trancada.`,versao_de_lula:`Sem manifestação direta localizada nas fontes consultadas; a defesa obteve o trancamento da ação.`,personagens:[`lula`,`marcelo-odebrecht`,`taiguara-santos`],valores:[],escandalos_relacionados:[`esc-bndes-t
